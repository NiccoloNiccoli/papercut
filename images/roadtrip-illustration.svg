<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">A photograph is subtly altered while the predicted location follows a deceptive route</title>
  <desc id="desc">A stylized photo on the left leads to a map on the right. A red path moves through intermediate predictions from the real location toward an attacker-chosen target; gray dots show other candidates.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1"><stop stop-color="#f1f7f5"/><stop offset="1" stop-color="#fff0f4"/></linearGradient>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#c9e6ea"/><stop offset="1" stop-color="#f4ead8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183547" flood-opacity=".12"/></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#d9e4e6" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L8 4.5 1 8" fill="none" stroke="#e21a4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="360" rx="18" fill="url(#back)"/>
  <g font-family="'Noto Sans',Arial,sans-serif">
    <text x="28" y="37" fill="#295044" font-size="12" font-weight="700" letter-spacing="1.4">ROADTRIP ATTACK · THE IDEA</text>
    <g filter="url(#shadow)">
      <rect x="28" y="58" width="276" height="240" rx="15" fill="#fff"/>
      <clipPath id="photoClip"><rect x="39" y="69" width="254" height="177" rx="9"/></clipPath>
      <g clip-path="url(#photoClip)">
        <rect x="39" y="69" width="254" height="177" fill="url(#sky)"/>
        <circle cx="240" cy="108" r="24" fill="#ffe5a7"/>
        <path d="M39 191 Q103 121 162 177 Q229 110 293 189V246H39Z" fill="#799b97"/>
        <path d="M39 205 Q112 161 170 201 Q236 157 293 209V246H39Z" fill="#476c69"/>
        <path d="M39 227 L88 186 111 199 144 168 177 189 208 161 248 190 293 174V246H39Z" fill="#294f56"/>
        <rect x="66" y="191" width="42" height="55" fill="#ebc6a3"/><path d="M61 191L87 174 113 191Z" fill="#ba625a"/>
        <rect x="119" y="209" width="36" height="37" fill="#e6d8bb"/><path d="M115 209L137 196 159 209Z" fill="#a95a57"/>
        <rect x="205" y="200" width="44" height="46" fill="#e4ba9d"/><path d="M200 200L227 181 254 200Z" fill="#ad625a"/>
        <path d="M78 212h7m14 0h7m26 12h8m76-8h8m16 0h8" stroke="#55777a" stroke-width="5"/>
        <g fill="#f10e43" opacity=".8"><rect x="257" y="91" width="5" height="5"/><rect x="264" y="101" width="4" height="4"/><rect x="247" y="109" width="4" height="4"/><rect x="273" y="112" width="5" height="5"/></g>
      </g>
      <text x="47" y="274" fill="#243139" font-size="15" font-weight="700">Same photo</text>
      <text x="276" y="274" text-anchor="end" fill="#a90a32" font-size="12" font-weight="700">+ tiny change</text>
    </g>
    <path d="M324 177h42" stroke="#e21a4d" stroke-width="3" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)"><rect x="389" y="58" width="543" height="240" rx="15" fill="#fff"/></g>
    <clipPath id="mapClip"><rect x="400" y="69" width="521" height="177" rx="9"/></clipPath>
    <g clip-path="url(#mapClip)">
      <rect x="400" y="69" width="521" height="177" fill="#e8f2f2"/>
      <rect x="400" y="69" width="521" height="177" fill="url(#grid)"/>
      <path d="M393 127 C473 73 494 125 555 93 S686 76 722 116 S837 119 939 76" fill="none" stroke="#d0ddda" stroke-width="31" stroke-linecap="round"/>
      <path d="M390 214 C458 169 499 199 563 170 S650 171 713 206 S815 180 936 197" fill="none" stroke="#d8e5e1" stroke-width="24" stroke-linecap="round"/>
      <path d="M452 103 C494 144 539 151 572 206 S648 205 684 147 S780 148 826 213" fill="none" stroke="#c4d7d5" stroke-width="7" stroke-linecap="round"/>
      <path d="M415 183 C504 193 554 108 631 113 S761 212 888 145" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <g fill="#9eaeb1"><circle cx="529" cy="202" r="5"/><circle cx="568" cy="112" r="5"/><circle cx="611" cy="185" r="5"/><circle cx="674" cy="102" r="5"/><circle cx="731" cy="206" r="5"/><circle cx="789" cy="109" r="5"/><circle cx="841" cy="198" r="5"/></g>
      <path d="M453 206 C496 198 490 149 548 157 S620 208 671 174 S712 104 766 133 S820 139 865 103" fill="none" stroke="#f10e43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <g fill="#fff" stroke="#f10e43" stroke-width="4"><circle cx="453" cy="206" r="8"/><circle cx="548" cy="157" r="7"/><circle cx="671" cy="174" r="7"/><circle cx="766" cy="133" r="7"/><circle cx="865" cy="103" r="9"/></g>
      <path d="M866 79v-25" stroke="#f10e43" stroke-width="2"/><path d="M866 55c7-8 19 3 26-5v19c-7 8-19-3-26 5Z" fill="#f10e43"/>
    </g>
    <text x="410" y="274" fill="#56666d" font-size="12">Real place</text>
    <text x="650" y="274" text-anchor="middle" fill="#a90a32" font-size="12" font-weight="700">Intermediate steps</text>
    <text x="909" y="274" text-anchor="end" fill="#56666d" font-size="12">Target</text>
    <text x="29" y="332" fill="#56666d" font-size="13">Small pixel changes steer the model’s predicted place along a deceptive route.</text>
  </g>
</svg>

